<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relationship Engine</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <p class="eyebrow">HUMAN INFRASTRUCTURE</p>
      <h1>Relationship Engine</h1>
      <p class="subtitle">
        Maintain continuity, take better swings, and convert relationships
        into trust, support, and opportunity.
      </p>
    </section>

    <nav class="pill-nav">
      <button class="pill">Today</button>
      <button class="pill active">People</button>
      <button class="pill">Log</button>
      <button class="pill">Swings</button>
    </nav>

    <section class="card">
      <h2>Add Relationship</h2>

      <input type="text" placeholder="Name" />

      <select>
        <option>Family</option>
        <option>Friend</option>
        <option>Partner</option>
        <option>Business</option>
      </select>

      <select>
        <option>Energizing</option>
        <option>Mixed</option>
        <option>Draining</option>
      </select>

      <label class="field-label">Follow-up Date</label>
      <input type="date" id="followUpDate" class="date-input" />

      <textarea placeholder="Important context, shared interests, current life themes"></textarea>

      <input type="text" placeholder="Tags: golf, deal flow, family, app feedback" />

      <button class="save-btn">Save Person</button>
    </section>
  </main>
</body>
</html>
