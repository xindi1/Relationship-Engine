<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2430">
<title>Relationship Engine Lite</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header class="hero">
<div>
<p class="eyebrow">Communication Pulse Layer</p>
<h1>Relationship Engine Lite</h1>
<p class="subtitle">Low-friction communication continuity tracking.</p>
</div>
<button id="themeBtn">◐</button>
</header>

<nav class="tabs">
<button class="tab active" data-tab="today">Today</button>
<button class="tab" data-tab="continuity">Continuity</button>
<button class="tab" data-tab="insights">Insights</button>
</nav>

<section id="today" class="panel active">
<div class="metrics">
<div class="metric"><span id="todayCount">0</span><small>today</small></div>
<div class="metric"><span id="weekCount">0</span><small>7 days</small></div>
</div>

<div class="card">
<h2>Quick Log</h2>
<div class="stack">
<input id="person" placeholder="Person">
<select id="mode">
<option>Text</option>
<option>Call</option>
<option>In-person</option>
<option>Video</option>
<option>Email</option>
</select>

<select id="energy">
<option>Energizing</option>
<option selected>Neutral</option>
<option>Mixed</option>
<option>Draining</option>
</select>

<label class="toggle">
<input id="followup" type="checkbox">
<span>Follow-up needed</span>
</label>

<label>Date</label>
<input id="date" type="date">

<textarea id="note" placeholder="Optional note"></textarea>

<button id="saveBtn" class="primary">Save</button>
</div>
</div>

<div class="card">
<h2>Recent</h2>
<div id="recentList"></div>
</div>
</section>

<section id="continuity" class="panel">
<div class="card">
<h2>Continuity</h2>
<div id="continuityList"></div>
</div>
</section>

<section id="insights" class="panel">
<div class="metrics">
<div class="metric"><span id="energizingCount">0</span><small>energizing</small></div>
<div class="metric"><span id="drainingCount">0</span><small>draining</small></div>
</div>

<div class="card">
<h2>Mode Distribution</h2>
<div id="modeList"></div>
</div>
</section>

<script src="app.js"></script>
</body>
</html>
